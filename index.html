<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Custom HTML Form</title>
		<link rel="stylesheet" href="css/site.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
		<script src="js/site.js"></script>
	</head>
	<body>
	   <main>
			<section class="form-section">
				<div class="form-container">
					<h2>HTML Forms</h2>
					<form id="simpleForm">
						<div class="form-grid">
						 <!-- Row 1 -->
						  <div class="form-group">
							<label for="emailAddress">Email Address</label>
							<input type="email" id="emailAddress" name="emailAddress" placeholder="e.g. b.smith@google.co.uk" required>
						  </div>
						  <div class="form-group">
							<label for="username">Username</label>
							<input type="text" id="username" name="username" placeholder="e.g. BSmith75" required>
						  </div>
						  <!-- Row 2 -->
						  <div class="form-group">
							<label for="password">Password</label>
							<input type="password" id="password" name="password" placeholder="Enter your password" required>
						  </div><!-- Row 2 -->
						  <div class="form-group">
							<label for="confirmPassword">Confirm Password</label>
							<input type="password" id="confirmPassword" name="confirmPassword" placeholder="Enter your password" required>
						  </div>
						</div>
						<button type="submit" class="btn-submit-form">Submit Request</button>
					</form> 
				</div>
			</section>
		</main>
	</body>
</html>
